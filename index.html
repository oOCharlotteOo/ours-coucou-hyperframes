<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ours coucou — HyperFrames</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#fff1d6,#f8c9b9 58%,#c8d9f5);color:#493b37}
    .scene{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .sun{position:absolute;top:9%;right:12%;width:130px;height:130px;border-radius:50%;background:#ffd36b;box-shadow:0 0 70px #ffe39c;opacity:.9}
    .title{z-index:2;text-align:center;font-size:clamp(42px,7vw,76px);font-weight:850;letter-spacing:-2px;margin:0 20px 12px;animation:pop .8s both}
    .subtitle{z-index:2;font-size:clamp(20px,3vw,30px);text-align:center;margin:0 24px 35px;animation:fade 1s .3s both}
    .bear{position:relative;width:300px;height:330px;animation:bob 2.2s ease-in-out infinite}
    .body{position:absolute;width:205px;height:205px;left:48px;bottom:0;border-radius:48% 48% 42% 42%;background:#a96d45;box-shadow:inset -15px -10px #895537}
    .head{position:absolute;width:235px;height:210px;left:33px;top:0;border-radius:48% 48% 46% 46%;background:#b97b50;z-index:2}
    .ear{position:absolute;width:72px;height:72px;top:-12px;border-radius:50%;background:#a96d45;border:10px solid #b97b50}
    .ear.left{left:20px}.ear.right{right:20px}
    .muzzle{position:absolute;width:104px;height:70px;left:65px;top:112px;border-radius:50%;background:#f4d5b7}
    .eye{position:absolute;top:88px;width:13px;height:17px;border-radius:50%;background:#382a27}.eye.left{left:68px}.eye.right{right:68px}
    .nose{position:absolute;top:124px;left:105px;width:26px;height:18px;border-radius:50%;background:#49312d}
    .smile{position:absolute;top:142px;left:105px;width:26px;height:14px;border-bottom:4px solid #75473b;border-radius:50%}
    .arm{position:absolute;z-index:3;width:65px;height:125px;right:4px;top:145px;background:#b97b50;border-radius:40px;transform-origin:30px 25px;animation:wave .65s ease-in-out infinite alternate}
    .paw{position:absolute;right:-8px;top:-17px;width:72px;height:65px;background:#b97b50;border-radius:50%}
    .paw:before,.paw:after{content:"";position:absolute;top:-10px;width:23px;height:29px;border-radius:50%;background:#b97b50}
    .paw:before{left:10px}.paw:after{right:10px}
    .feet{position:absolute;bottom:-9px;left:65px;width:75px;height:42px;border-radius:50%;background:#895537;box-shadow:95px 0 #895537}
    .caption{z-index:2;margin-top:35px;font-size:clamp(22px,3vw,32px);font-weight:700;animation:fade 1s .8s both}
    @keyframes wave{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
    @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
  </style>
</head>
<body>
  <main class="scene">
    <div class="sun"></div>
    <h1 class="title">Coucou toi !</h1>
    <p class="subtitle">J'avais envie de te saluer ☀️</p>
    <div class="bear" role="img" aria-label="Un ours brun qui fait coucou">
      <div class="ear left"></div><div class="ear right"></div>
      <div class="body"></div><div class="head"></div>
      <div class="eye left"></div><div class="eye right"></div>
      <div class="muzzle"></div><div class="nose"></div><div class="smile"></div>
      <div class="arm"><div class="paw"></div></div><div class="feet"></div>
    </div>
    <div class="caption">👋 Hello !</div>
  </main>
</body>
</html>

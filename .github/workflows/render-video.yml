name: Render and publish bear video

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: npm install

      - name: Check HyperFrames environment
        run: npx hyperframes doctor

      - name: Render 5-second MP4
        run: |
          mkdir -p renders
          npx hyperframes render --output renders/ours-coucou.mp4 --fps 30 --quality standard

      - name: Verify rendered video
        run: |
          test -s renders/ours-coucou.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 renders/ours-coucou.mp4

      - name: Upload MP4 as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ours-coucou-video
          path: renders/ours-coucou.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: renders/ours-coucou.mp4
          generate_release_notes: true
